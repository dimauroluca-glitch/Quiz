<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteQuiz AI - 100% Locale e Gratuito</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1, h2 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #357abd; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .hidden { display: none !important; }
        
        /* Barra di avanzamento per il download del modello */
        .progress-container { background: #eef2f7; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }
        .progress-bar-bg { width: 100%; background-color: #ddd; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { width: 0%; height: 100%; background-color: var(--primary); transition: width 0.3s; }
        
        .tf-container { display: flex; gap: 20px; justify-content: center; padding: 0; margin-top: 20px; }
        .option-btn {
            flex: 1;
            max-width: 200px;
            background: var(--light);
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: all 0.2s;
        }
        .option-btn:hover { background: #edf2f7; border-color: var(--primary); }
        
        .options-list { list-style: none; padding: 0; margin-top: 20px; }
        .option-item {
            background: var(--light);
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: all 0.2s;
            font-size: 16px;
        }
        .option-item:hover { background: #edf2f7; border-color: var(--primary); }
        
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        
        .score { text-align: center; font-size: 18px; font-weight: bold; margin-top: 20px; }
        .feedback { text-align: center; font-size: 16px; margin-top: 20px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 NoteQuiz AI 100% Locale</h1>
    <p class="subtitle">Nessuna chiave API. L'IA gira direttamente sul tuo computer in modo anonimo e gratuito.</p>
    
       <!-- 1. Schermata Input Testo -->
    <div id="setup-screen">
        <textarea id="notes-input" placeholder="Incolla qui i tuoi appunti..."></textarea>
        <!-- Rimosso onclick, aggiunto id="generate-btn" -->
        <button id="generate-btn">Inizializza IA e Genera Quiz</button>
        
        <!-- Stato di Caricamento Modello IA -->
        <div id="loading-box" class="progress-container hidden">
            <span id="loading-text" style="font-size: 13px; font-weight: bold; color: var(--dark);">Caricamento del motore IA...</span>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>


    <!-- 2. Schermata Svolgimento Quiz -->
    <div id="quiz-screen" class="hidden">
        <h2 id="question-text">Domanda</h2>
        <ul id="options-container" class="options-list"></ul>
        
        <div id="tf-container" class="tf-container hidden">
            <div id="btn-vero" class="option-btn" onclick="checkTrueFalse('Vero')">VERO</div>
            <div id="btn-falso" class="option-btn" onclick="checkTrueFalse('Falso')">FALSO</div>
        </div>
        
        <div id="feedback-text" class="feedback"></div>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">Prossima Domanda</button>
    </div>

    <!-- 3. Schermata dei Risultati -->
    <div id="result-screen" class="hidden">
        <h2>🎉 Quiz Completato!</h2>
        <p class="score">Punteggio finale: <span id="final-score">0</span> / 10</p>
        <div id="evaluation-text" style="font-size: 20px; font-weight: bold; text-align: center; margin: 20px 0;"></div>
        <button onclick="resetQuiz()">Inizia un altro quiz</button>
    </div>
</div>

<!-- LIBRERIA WEBLLM DA CDN (Moduli moderni di tipo script) -->
<script type="module" src="quiz.js"></script>
</body>
</html>
