<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Neon Dungeon - Dual HUD Bars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Schermata Iniziale -->
    <div id="startScreen" class="overlay">
        <h1 class="neonText">NEON DUNGEON PRO</h1>
        <button id="startBtn" class="actionBtn">CONTINUA AVVENTURA</button>
    </div>

    <!-- Schermata di Game Over -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 class="redNeonText">EROE CADUTO</h1>
        <p>La run corrente è azzerata. Si riparte dal Piano 1, ma i record restano salvati.</p>
        <div id="statsSummary">Piano Massimo: <span id="summaryFloor">1</span> | Livello: <span id="summaryLevel">1</span></div>
        <button id="restartBtn" class="actionBtn redBtn">RICOMINCIA RUN</button>
    </div>

    <!-- Interfaccia di Gioco -->
    <div id="floorTitle">PIANO: 1 (REGIONE: NEON)</div>
    <div id="classTitle">Classe: Recluta</div>

    <div id="gameUi">
        <div>HP: <span id="hpLabel">100</span>/<span id="maxHpLabel">100</span></div>
        <div>LV: <span id="levelLabel">1</span></div>
        <div>Oro: <span id="goldLabel">0</span></div>
    </div>
    
    <div id="recordUi">
        🏆 Record: PIANO <span id="bestFloor">1</span> | 💰 Oro Max: <span id="bestGold">0</span>
    </div>

    <div id="equipUi">
        <div>⚔️ <span id="weaponEq">Legno</span></div>
        <div>🛡️ +<span id="defenseEq">0</span> Def</div>
        <div>👟 <span id="bootsEq">Normali</span></div>
        <div>💍 <span id="ringEq">Nessuno</span></div>
    </div>

    <!-- CONTENITORE CANVAS CON DOPPIA BARRA STATISTICHE STATICA -->
    <div id="canvasContainer">
        <!-- Nuova Barra della Vita Rossa (HP) -->
        <div id="hpBarContainer">
            <div id="hpBarFill"></div>
        </div>

        <canvas id="gameCanvas" width="450" height="450"></canvas>
        
        <!-- Nuova Barra dell'Esperienza Azzurra (EXP) -->
        <div id="expBarContainer">
            <div id="expBarFill"></div>
        </div>
    </div>

    <!-- Negozio Equipaggiamento -->
    <div id="shopUi">
        <button class="shopBtn" id="buyPotion">🧪 Pozione (+50 HP)<br><span class="price">40 Oro</span></button>
        <button class="shopBtn" id="buyWeapon">⚔️ Nuova Arma<br><span class="price" id="weaponPrice">80 Oro</span></button>
        <button class="shopBtn" id="buyArmor">🛡️ Up Armatura<br><span class="price" id="armorPrice">70 Oro</span></button>
        <button class="shopBtn" id="buyBoots">👟 Up Stivali<br><span class="price" id="bootsPrice">90 Oro</span></button>
        <button class="shopBtn" id="buyRing" style="grid-column: span 2;">💍 Potenzia Anello dell'Anima (+EXP)<br><span class="price" id="ringPrice">150 Oro</span></button>
    </div>

    <div id="mobileControlsArea">
        <div id="joystickZone"></div>
        <div id="actionZone">
            <button id="btnSkill">ABIL</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
